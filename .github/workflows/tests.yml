name: Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest

    # No sound card on the runner.
    env:
      CEWKA_NULL_AUDIO: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check version numbers
        run: ./tools/sprawdz-wersje.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1

      - name: Build native library
        run: ./native/build-linux.sh

      - name: Test
        run: dotnet test Cewka.sln --configuration Release

      - name: Generate audio samples
        run: dotnet run --project tools/Cewka.Snapshots -c Release -- --material artifacts/material

      - name: Check window behaviour
        run: |
          dotnet run --project tools/Cewka.Snapshots -c Release -- \
            artifacts/zrzuty \
            artifacts/material/probka-dluga.wav \
            artifacts/material/probka-krotka.wav \
            --sprawdzenia

      - name: Compare screenshots
        run: |
          dotnet run --project tools/Cewka.Snapshots -c Release -- \
            artifacts/zrzuty \
            artifacts/material/probka-dluga.wav \
            artifacts/material/probka-krotka.wav \
            --porownaj tests/odniesienie

      # A missing reference image is created and passes locally. Here the checkout is thrown
      # away, so the run has to fail and hand the new images over for review.
      - name: Look for new reference images
        if: always()
        id: reference
        run: |
          if [ -n "$(git status --porcelain tests/odniesienie)" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            git status --porcelain tests/odniesienie
          fi

      - name: Upload new reference images
        if: always() && steps.reference.outputs.new == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reference-images
          path: tests/odniesienie

      - name: Fail on missing reference images
        if: always() && steps.reference.outputs.new == 'true'
        run: |
          echo "Reference images are missing. Review the reference-images artifact and commit it." >&2
          exit 1

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/zrzuty

  windows:
    name: Windows
    runs-on: windows-latest

    env:
      CEWKA_NULL_AUDIO: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build native library
        run: native\build-windows.cmd
        shell: cmd

      - name: Test
        run: dotnet test Cewka.sln --configuration Release
