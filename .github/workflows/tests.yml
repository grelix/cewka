# Testy, sprawdziany zachowania i porównanie wyglądu na Linuksie oraz testy na Windowsie.
#
# Osobny plik, bo tych samych testów potrzebuje każda zmiana w gałęzi głównej (build.yml)
# i każde wydanie (release.yml). Wydanie nie może powstać z kodu, który ich nie przeszedł.
#
# Warstwa natywna nie jest trzymana w repozytorium, więc każdy przebieg kompiluje ją od zera
# ze źródła i nie może trafić na bibliotekę z poprzedniej wersji.

name: Testy

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux — testy i zrzuty
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Zgodność numerów wersji
        run: ./tools/sprawdz-wersje.sh

      - name: Zależności rysowania i dźwięku
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1 pulseaudio

          # Maszyna nie ma karty dźwiękowej, więc powstaje puste urządzenie. Zrzuty pokazują
          # utwór w trakcie odtwarzania, a obrazy odniesienia powstały właśnie w takim układzie.
          #
          # Pułapka: bez limitu `pulseaudio --start` potrafi nie wrócić i zawiesić przebieg
          # na kwadrans. Każde polecenie ma więc limit i wolno mu się nie udać; brak dźwięku
          # ujawnią wtedy same sprawdziany i porównanie zrzutów.
          timeout 40 pulseaudio --start --exit-idle-time=-1 || echo "pulseaudio: nie wystartowal"
          timeout 20 pactl load-module module-null-sink sink_name=cewka || echo "brak pustego urzadzenia"
          timeout 20 pactl list short sinks || true

      - name: Biblioteka natywna
        run: ./native/build-linux.sh

      - name: Testy
        run: dotnet test Cewka.sln --configuration Release

      # CEWKA_NULL_AUDIO=1 to prośba o puste wyjście silnika. Silnik jej jeszcze nie obsługuje,
      # więc do tego czasu narzędzie zrzutów gra przez puste urządzenie pulseaudio.
      - name: Materiał dźwiękowy
        env:
          CEWKA_NULL_AUDIO: '1'
        run: dotnet run --project tools/Cewka.Snapshots -c Release -- --material artifacts/material

      - name: Sprawdziany zachowania
        # Trwają sekundy, a rozstrzygają o wyrównaniu nagłówków, pamięci wysokości okna
        # i o tym, czy zastąpienie kolejki plikiem z zewnątrz odtwarza właśnie ten plik.
        env:
          CEWKA_NULL_AUDIO: '1'
        run: |
          dotnet run --project tools/Cewka.Snapshots -c Release -- \
            artifacts/zrzuty \
            artifacts/material/probka-dluga.wav \
            artifacts/material/probka-krotka.wav \
            --sprawdzenia

      - name: Zrzuty i porównanie z odniesieniem
        env:
          CEWKA_NULL_AUDIO: '1'
        run: |
          dotnet run --project tools/Cewka.Snapshots -c Release -- \
            artifacts/zrzuty \
            artifacts/material/probka-dluga.wav \
            artifacts/material/probka-krotka.wav \
            --porownaj tests/odniesienie

      - name: Czy powstały nowe obrazy odniesienia
        if: always()
        id: odniesienie
        run: |
          if [ -n "$(git status --porcelain tests/odniesienie)" ]; then
            echo "nowe=tak" >> "$GITHUB_OUTPUT"
            echo "Katalog odniesienia zmienił się w tym przebiegu:"
            git status --porcelain tests/odniesienie
            echo
            echo "Obrazy odniesienia muszą powstać na tej samej maszynie, która je potem"
            echo "porównuje — rasteryzacja w Linuksie różni się od tej w Windowsie."
            echo "Należy pobrać artefakt 'odniesienie', przejrzeć go i dodać do repozytorium."
          fi

      - name: Odłóż obrazy odniesienia
        if: always() && steps.odniesienie.outputs.nowe == 'tak'
        uses: actions/upload-artifact@v7
        with:
          name: odniesienie
          path: tests/odniesienie

      # Brak wzorca w lokalnym przebiegu tworzy go i przechodzi, tu ma zatrzymać przebieg:
      # checkout jest ulotny, więc wzorzec powstawałby od nowa za każdym razem, a porównanie
      # tego zrzutu niczego by nie pilnowało.
      - name: Wymagaj kompletu odniesienia
        if: always() && steps.odniesienie.outputs.nowe == 'tak'
        run: |
          echo "BLAD: brak obrazu odniesienia — porownanie nie pilnuje wygladu." >&2
          exit 1

      - name: Odłóż zrzuty i obrazy różnicowe
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: zrzuty
          path: artifacts/zrzuty

  windows:
    name: Windows — testy
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Biblioteka natywna
        # Skrypt odnajduje kompilator przez vswhere; obraz maszyny ma Visual Studio 2022
        # ze składnikiem narzędzi C++.
        run: native\build-windows.cmd
        shell: cmd

      - name: Testy
        run: dotnet test Cewka.sln --configuration Release
