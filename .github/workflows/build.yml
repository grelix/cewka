# Budowa i testy przy każdej zmianie w gałęzi głównej.

name: Budowa i testy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Kolejne wypchnięcie tej samej gałęzi zastępuje poprzedni przebieg zamiast czekać w kolejce.
concurrency:
  group: budowa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Te same testy uruchamia potok wydania, dlatego mieszkają we wspólnym pliku.
  testy:
    name: Testy
    uses: ./.github/workflows/tests.yml

  # Pakiety i próby instalacyjne w kontenerach, z tego samego pliku co potok wydania, żeby
  # zepsute pakowanie wyszło przy zmianie.
  pakiety:
    name: Linux
    uses: ./.github/workflows/packages.yml
