name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(./tools/sprawdz-wersje.sh "$GITHUB_REF_NAME")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Tag must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to a commit outside main." >&2
            exit 1
          fi

  tests:
    name: Tests
    needs: check
    uses: ./.github/workflows/tests.yml

  packages:
    name: Packages
    needs: check
    uses: ./.github/workflows/packages.yml

  windows:
    name: Windows build
    needs: check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: tools\publish-windows.cmd
        shell: cmd

      - name: Add third-party notices
        run: copy THIRD-PARTY-NOTICES.txt artifacts\publish\win-x64\THIRD-PARTY-NOTICES.txt
        shell: cmd

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: |
            artifacts/publish/win-x64/Cewka.exe
            artifacts/publish/win-x64/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  release:
    name: Draft release
    needs: [check, tests, packages, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: files

      - uses: actions/download-artifact@v8
        with:
          name: windows-exe
          path: files

      - name: Checksums
        run: |
          cd files
          find . -maxdepth 1 -type f -printf '%P\n' | sort > /tmp/files.txt
          xargs -a /tmp/files.txt sha256sum > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The changes come from this version's section of CHANGELOG.md.
          awk -v version="$VERSION" '
            /^## / { inside = ($2 == version); next }
            inside
          ' CHANGELOG.md > changes.md

          if ! grep -q '[^[:space:]]' changes.md; then
            echo "CHANGELOG.md has no section for $VERSION." >&2
            exit 1
          fi

          {
            sed -e 's/^### /## /' -e '/./,$!d' changes.md
            echo
            echo "## Instalacja"
            echo
            echo "**Fedora, RHEL**"
            echo
            echo '```bash'
            echo "sudo dnf install ./cewka-$VERSION-1.x86_64.rpm"
            echo '```'
            echo
            echo "**openSUSE**"
            echo
            echo '```bash'
            echo "sudo zypper install ./cewka-$VERSION-1.x86_64.rpm"
            echo '```'
            echo
            echo "**Debian, Ubuntu, Linux Mint**"
            echo
            echo '```bash'
            echo "sudo apt install ./cewka_${VERSION}_amd64.deb"
            echo '```'
            echo
            echo "**Arch, Manjaro**"
            echo
            echo '```bash'
            echo "sudo pacman -U cewka-$VERSION-1-x86_64.pkg.tar.zst"
            echo '```'
            echo
            echo "**Inne dystrybucje**: archiwum \`cewka-$VERSION-linux-x64.tar.gz\` można rozpakować i uruchomić bez instalacji."
            echo
            echo "**Windows**: pobrać \`Cewka.exe\` i uruchomić. Plik nie jest podpisany certyfikatem, więc przy"
            echo "pierwszym uruchomieniu pojawi się ostrzeżenie SmartScreen."
            echo
            echo "Sumy kontrolne są w \`SHA256SUMS.txt\`; w Linuksie sprawdza je \`sha256sum -c SHA256SUMS.txt --ignore-missing\`."
            echo
            echo "## Sumy kontrolne"
            echo
            echo '```'
            cat files/SHA256SUMS.txt
            echo '```'
          } > notes.md

          cat notes.md

      # A re-run for the same tag fails while the previous draft exists; delete the draft first.
      - name: Create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Cewka $VERSION" \
            --notes-file notes.md \
            files/*

          gh release view "$GITHUB_REF_NAME" --json url --jq .url
