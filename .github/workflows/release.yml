# Wydanie budowane ze znacznika.
#
# Powstaje szkic: pliki i sumy kontrolne przygotowuje maszyna, opis i publikacja należą do autora.
#
# Ponowne uruchomienie dla tego samego znacznika nie powiedzie się, dopóki poprzedni szkic
# istnieje; szkic trzeba najpierw usunąć, żeby nie powstały dwa wydania jednej wersji.

name: Wydanie

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  sprawdzenie:
    name: Zgodność znacznika z wersją
    runs-on: ubuntu-latest

    outputs:
      wersja: ${{ steps.odczyt.outputs.wersja }}

    steps:
      # Pełna historia: bez niej nie ma gałęzi main, z którą porównywany jest znacznik.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Odczyt wersji
        id: odczyt
        run: |
          echo "znacznik: $GITHUB_REF_NAME"
          WERSJA="$(./tools/sprawdz-wersje.sh "$GITHUB_REF_NAME")"
          echo "wersja:   $WERSJA"
          echo "wersja=$WERSJA" >> "$GITHUB_OUTPUT"

      - name: Znacznik na gałęzi głównej
        # Wydanie powstaje tylko z tego, co weszło do main, a więc przeszło przegląd i budowę.
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "BLAD: znacznik $GITHUB_REF_NAME wskazuje zatwierdzenie spoza gałęzi main." >&2
            exit 1
          fi

  # Pełne testy na obu systemach, te same co przy każdej zmianie. Bez nich szkic wydania
  # mógłby powstać ze znacznika na zatwierdzeniu z czerwonymi testami.
  testy:
    name: Testy
    needs: sprawdzenie
    uses: ./.github/workflows/tests.yml

  # Budowa pakietów i próby instalacyjne mieszkają w osobnym pliku, bo to samo potrzebne jest
  # także poza wydaniem — do sprawdzenia na żądanie, czy pakiety nadal się instalują.
  pakiety:
    name: Linux
    needs: sprawdzenie
    uses: ./.github/workflows/packages.yml

  windows:
    name: Windows — plik wykonywalny
    needs: sprawdzenie
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Publikacja
        run: tools\publish-windows.cmd
        shell: cmd

      - name: Odłóż plik wykonywalny
        uses: actions/upload-artifact@v7
        with:
          name: plik-windows
          path: artifacts/publish/win-x64/Cewka.exe
          if-no-files-found: error

  wydanie:
    name: Szkic wydania
    needs: [sprawdzenie, testy, pakiety, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pakiety-linux
          path: pobrane

      - uses: actions/download-artifact@v8
        with:
          name: plik-windows
          path: pobrane

      - name: Sumy kontrolne
        # Lista plików powstaje przed policzeniem sum i jest posortowana, żeby plik z sumami
        # nie policzył sam siebie i żeby kolejność wpisów nie zależała od kolejności pobierania.
        run: |
          cd pobrane
          ls -lh
          find . -maxdepth 1 -type f -printf '%P\n' | sort > /tmp/lista.txt
          xargs -a /tmp/lista.txt sha256sum > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Opis szkicu
        env:
          WERSJA: ${{ needs.sprawdzenie.outputs.wersja }}
        run: |
          {
            echo "> Szkic zbudowany maszynowo ze znacznika \`$GITHUB_REF_NAME\`."
            echo "> Opis merytoryczny należy dopisać przed publikacją, a ten akapit usunąć."
            echo
            echo "## Testy"
            echo
            echo "Pełne testy na Linuksie i Windowsie, sprawdziany zachowania i porównanie wyglądu"
            echo "z obrazami odniesienia przeszły w tym przebiegu na zatwierdzeniu znacznika."
            echo
            echo "## Próbne instalacje"
            echo
            echo "Pakiety \`.deb\`, \`.rpm\` i pacmana zostały w tym przebiegu zainstalowane"
            echo "w kontenerach Ubuntu 24.04, bieżącej Fedory i Archa: program z każdego z nich"
            echo "uruchomił się, wpis w menu przeszedł sprawdzenie poprawności, a po usunięciu"
            echo "pakietu nie zostało nic."
            echo
            echo "## Sumy kontrolne"
            echo
            echo '```'
            cat pobrane/SHA256SUMS.txt
            echo '```'
          } > opis.md

          cat opis.md

      - name: Utwórz szkic wydania
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WERSJA: ${{ needs.sprawdzenie.outputs.wersja }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Cewka $WERSJA" \
            --notes-file opis.md \
            pobrane/*

          echo
          echo "Szkic gotowy: $(gh release view "$GITHUB_REF_NAME" --json url --jq .url)"
