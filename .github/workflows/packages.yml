name: Packages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools zstd libfontconfig1

      - name: Publish
        run: ./tools/publish-linux.sh

      - name: Read version
        id: meta
        run: |
          VERSION="$(./tools/sprawdz-wersje.sh)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Commit time instead of build time keeps the packages reproducible.
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build packages
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        run: ./tools/build-packages.sh

      # Plain archive for the AUR package and for running without installing.
      - name: Build archive
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        run: |
          DIR="cewka-$VERSION"
          mkdir -p "artifacts/archiwum/$DIR"

          install -Dm755 artifacts/publish/linux-x64/Cewka "artifacts/archiwum/$DIR/cewka"
          install -Dm644 LICENSE "artifacts/archiwum/$DIR/LICENSE"
          install -Dm644 THIRD-PARTY-NOTICES.txt "artifacts/archiwum/$DIR/THIRD-PARTY-NOTICES.txt"
          install -Dm644 README.md "artifacts/archiwum/$DIR/README.md"
          install -Dm644 packaging/linux/cewka.desktop "artifacts/archiwum/$DIR/cewka.desktop"
          cp -r packaging/linux/icons "artifacts/archiwum/$DIR/icons"
          install -Dm644 assets/ikona/cewka.svg "artifacts/archiwum/$DIR/icons/cewka.svg"

          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$SOURCE_DATE_EPOCH" \
              -czf "artifacts/packages/cewka-$VERSION-linux-x64.tar.gz" \
              -C artifacts/archiwum "$DIR"

      # The licences of bundled components require their notices in every package.
      - name: Check third-party notices
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts/packages

          # The file list goes into a variable first: grep -q in a pipe stops reading early,
          # which pipefail would report as an error.
          check() {
            local package="$1" file="$2" list="$3"
            if ! grep -qxF "$file" <<< "$list"; then
              echo "$package does not contain $file" >&2
              exit 1
            fi
            echo "$package: $file"
          }

          DEB="cewka_${VERSION}_amd64.deb"
          RPM="cewka-${VERSION}-1.x86_64.rpm"
          PACMAN="cewka-${VERSION}-1-x86_64.pkg.tar.zst"
          ARCHIVE="cewka-${VERSION}-linux-x64.tar.gz"

          check "$DEB" ./usr/share/doc/cewka/THIRD-PARTY-NOTICES.txt "$(dpkg-deb -c "$DEB" | awk '{ print $6 }')"
          check "$RPM" /usr/share/licenses/cewka/THIRD-PARTY-NOTICES.txt "$(rpm -qlp "$RPM")"
          check "$PACMAN" usr/share/licenses/cewka/THIRD-PARTY-NOTICES.txt "$(bsdtar -tf "$PACMAN")"
          check "$ARCHIVE" "cewka-${VERSION}/THIRD-PARTY-NOTICES.txt" "$(tar -tzf "$ARCHIVE")"

      - name: Generate audio samples
        env:
          CEWKA_NULL_AUDIO: '1'
        run: dotnet run --project tools/Cewka.Snapshots -c Release -- --material artifacts/material

      - name: Test installs in containers
        run: ./tools/test-packages.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: artifacts/packages
          if-no-files-found: error
