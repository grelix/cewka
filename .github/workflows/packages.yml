# Pakiety dla Linuksa wraz z próbną instalacją w kontenerach.
#
# Osobny plik, bo korzystają z niego budowa przy każdej zmianie, wydanie ze znacznika
# i sprawdzenie na żądanie.

name: Pakiety Linuksa

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pakiety:
    name: Pakiety i próbne instalacje
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Narzędzia pakujące
        # bsdtar przychodzi z libarchive-tools, rpmbuild z rpm.
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools zstd libfontconfig1

      - name: Publikacja
        run: ./tools/publish-linux.sh

      - name: Wersja i znacznik czasu
        id: dane
        run: |
          WERSJA="$(./tools/sprawdz-wersje.sh)"
          echo "wersja=$WERSJA" >> "$GITHUB_OUTPUT"

          # Znacznik czasu z zatwierdzenia, a nie z chwili budowy: trafia do metadanych pakietu
          # pacmana, czasów jego plików i daty w %changelog RPM, więc bez tego dwie budowy
          # tego samego materiału dawałyby różne pliki.
          echo "epoka=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Pakiety
        env:
          SOURCE_DATE_EPOCH: ${{ steps.dane.outputs.epoka }}
        run: ./tools/build-packages.sh

      - name: Archiwum z gotowym plikiem wykonywalnym
        # Potrzebne pakietowi w AUR, który nie powinien rozpakowywać cudzego pakietu,
        # oraz każdemu, kto woli rozpakować i uruchomić bez instalowania.
        env:
          WERSJA: ${{ steps.dane.outputs.wersja }}
          SOURCE_DATE_EPOCH: ${{ steps.dane.outputs.epoka }}
        run: |
          KATALOG="cewka-$WERSJA"
          mkdir -p "artifacts/archiwum/$KATALOG"

          install -Dm755 artifacts/publish/linux-x64/Cewka "artifacts/archiwum/$KATALOG/cewka"
          install -Dm644 LICENSE "artifacts/archiwum/$KATALOG/LICENSE"
          install -Dm644 THIRD-PARTY-NOTICES.txt "artifacts/archiwum/$KATALOG/THIRD-PARTY-NOTICES.txt"
          install -Dm644 README.md "artifacts/archiwum/$KATALOG/README.md"
          install -Dm644 packaging/linux/cewka.desktop "artifacts/archiwum/$KATALOG/cewka.desktop"
          cp -r packaging/linux/icons "artifacts/archiwum/$KATALOG/icons"

          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@$SOURCE_DATE_EPOCH" \
              -czf "artifacts/packages/cewka-$WERSJA-linux-x64.tar.gz" \
              -C artifacts/archiwum "$KATALOG"

      - name: Noty składników w pakietach
        # Licencje składników pozwalają rozpowszechniać program tylko razem z ich notami.
        # Sprawdzana jest zawartość plików pakietów, bo obraz Ubuntu w próbnej instalacji
        # pomija przy instalacji dokumentację z /usr/share/doc poza plikami copyright.
        env:
          WERSJA: ${{ steps.dane.outputs.wersja }}
        run: |
          set -euo pipefail
          cd artifacts/packages

          # Spis plików trafia najpierw do zmiennej: grep -q w potoku kończy czytanie przed
          # końcem spisu, a pipefail uznałby przerwany program wypisujący za błąd.
          sprawdz() {
            local pakiet="$1" plik="$2" spis="$3"
            if ! grep -qxF "$plik" <<< "$spis"; then
              echo "BLAD: w $pakiet brak $plik" >&2
              exit 1
            fi
            echo "$pakiet: $plik"
          }

          DEB="cewka_${WERSJA}_amd64.deb"
          RPM="cewka-${WERSJA}-1.x86_64.rpm"
          PACMAN="cewka-${WERSJA}-1-x86_64.pkg.tar.zst"
          ARCHIWUM="cewka-${WERSJA}-linux-x64.tar.gz"

          sprawdz "$DEB" ./usr/share/doc/cewka/THIRD-PARTY-NOTICES.txt "$(dpkg-deb -c "$DEB" | awk '{ print $6 }')"
          sprawdz "$RPM" /usr/share/licenses/cewka/THIRD-PARTY-NOTICES.txt "$(rpm -qlp "$RPM")"
          sprawdz "$PACMAN" usr/share/licenses/cewka/THIRD-PARTY-NOTICES.txt "$(bsdtar -tf "$PACMAN")"
          sprawdz "$ARCHIWUM" "cewka-${WERSJA}/THIRD-PARTY-NOTICES.txt" "$(tar -tzf "$ARCHIWUM")"

      - name: Materiał do prób
        env:
          CEWKA_NULL_AUDIO: '1'
        run: dotnet run --project tools/Cewka.Snapshots -c Release -- --material artifacts/material

      - name: Próbne instalacje w kontenerach
        run: ./tools/test-packages.sh

      - name: Odłóż pakiety
        uses: actions/upload-artifact@v7
        with:
          name: pakiety-linux
          path: artifacts/packages
          if-no-files-found: error
